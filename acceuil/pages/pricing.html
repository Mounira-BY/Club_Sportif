    <script>
        fetch("../navbar.html")
            .then(res => res.text())
            .then(data => document.getElementById("navbar-placeholder").innerHTML = data);
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            loadAllAbonnements();
        });

        function loadAllAbonnements() {
            loadCategoryAbonnements('gym', 'gym-abonnements');
            loadCategoryAbonnements('coaching', 'coaching-abonnements');
            loadCategoryAbonnements('acces', 'acces-abonnements');
            loadCategoryAbonnements('padel', 'padel-abonnements');
            loadCategoryAbonnements('basketball', 'basketball-abonnements');
        }

        function loadCategoryAbonnements(category, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const abonnements = abonnementsManager.getAbonnementsByCategory(category);
            container.innerHTML = '';

            abonnements.forEach(abonnement => {
                const block = document.createElement('div');
                block.className = 'block';

                let content = `<p>${abonnement.nom}
                    <span class="price">${abonnement.prix}DT/
                        <sub>${abonnement.duree}</sub>
                    </span>`;

                if (abonnement.description) {
                    content += `<ul class="options"><li>${abonnement.description}</li></ul>`;
                }

                if (abonnement.pack10) {
                    content += `<ul class="options">
                        <li>${abonnement.pack10}DT / Pack 10 Séances</li>
                    </ul>`;
                }

                content += '</p>';
                block.innerHTML = content;
                container.appendChild(block);
            });
        }
    </script>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/scripts.js"></script>
    <script src="../js/startbootstrap.js"></script>
