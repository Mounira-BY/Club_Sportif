<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Abonnements Club Sportif" />
    <meta name="author" content="Club Sportif" />
    <title>Abonnements - Club Sportif</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
    <link href="../css/monserrat.css" rel="stylesheet" type="text/css" />
    <link href="../css/robottoslab.css" rel="stylesheet" type="text/css" />
    <link href="../css/styles.css" rel="stylesheet" />
    <link href="../css/abonnements-form.css" rel="stylesheet" />
    <link href="../css/fontawesome/css/all.min.css" rel="stylesheet" type="text/css" />
    <script src="../js/all.js" crossorigin="anonymous"></script>
    <script src="../js/abonnements-manager.js"></script>
</head>

<body id="page-top">

    <div id="navbar-placeholder"></div>

    <header class="masthead pricing sample-page">
        <div class="container">
            <div class="masthead-subheading">Abonnements</div>
        </div>
    </header>


    <section class="page-section">
        <div class="container">

            <div id="gym" class="table">
                <h2 class="heading text-center">
                    <i class="fas fa-dumbbell"></i> Gym
                </h2>
                <div id="gym-abonnements" class="abonnements-container">

                </div>
                <a href="#abonnement-form-section" class="btn" style="display: flex;">
                    <p style="padding-left: 36px; position: relative; bottom: 4px;">Abonnez vous</p>
                    <span class="fas fa-cart-plus" aria-hidden="true"
                        style="position: relative; top: 12px; padding-left: 16px;"></span>
                </a>
            </div>

            <div id="private" class="table">
                <h2 class="heading text-center">
                    <i class="fas fa-lock"></i> Coaching Privé
                </h2>
                <div id="coaching-abonnements" class="abonnements-container">

                </div>
                <a href="#abonnement-form-section" class="btn" style="display: flex;">
                    <p style="padding-left: 36px; position: relative; bottom: 4px;">Abonnez vous</p>
                    <span class="fa fa-cart-plus" aria-hidden="true"
                        style="position: relative; top: 12px; padding-left: 16px;"></span>
                </a>
            </div>

            <div id="passenger" class="table">
                <h2 class="heading text-center">
                    <i class="fas fa-person-walking-arrow-right"></i> Accès Libre
                </h2>
                <div id="acces-abonnements" class="abonnements-container">

                </div>
                <a href="#abonnement-form-section" class="btn" style="display: flex;">
                    <p style="padding-left: 36px; position: relative; bottom: 4px;">Abonnez vous</p>
                    <span class="fa fa-cart-plus" aria-hidden="true"
                        style="position: relative; top: 12px; padding-left: 16px;"></span>
                </a>
            </div>

        </div>
    </section>


    <section class="page-section" id="abonnement-form-section">
        <div class="container">

            <div class="text-center">
                <h2 class="section-heading text-uppercase">Souscrire un Abonnement</h2>
                <h3 class="section-subheading text-muted">
                    Remplissez le formulaire ci-dessous pour finaliser votre abonnement
                </h3>
            </div>

            <form id="aboForm" novalidate>
                <div class="row align-items-stretch mb-5">


                    <div class="col-md-6">
                        <div class="form-group">
                            <input class="form-control" id="abo-name" type="text"
                                   placeholder="Votre Nom *" required />
                        </div>
                        <div class="form-group">
                            <input class="form-control" id="abo-email" type="email"
                                   placeholder="Votre Email *" required />
                        </div>
                        <div class="form-group mb-md-0">
                            <input class="form-control" id="abo-phone" type="tel"
                                   placeholder="Votre Téléphone *" required
                                   pattern="[0-9+\s\-]{8,15}" />
                        </div>
                    </div>


                    <div class="col-md-6">
                        <div class="form-group">
                            <select class="form-control" id="abo-category" required>
                                <option value="" disabled selected>Sélectionnez une catégorie *</option>
                                <option value="gym">🏋️ Gym</option>
                                <option value="coaching">🔒 Coaching Privé</option>
                                <option value="acces">🚶 Accès Libre</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <select class="form-control" id="abo-duree" required>
                                <option value="" disabled selected>Sélectionnez une durée *</option>
                                <option value="1 mois">1 Mois</option>
                                <option value="3 mois">3 Mois</option>
                                <option value="6 mois">6 Mois</option>
                                <option value="1 an">1 An</option>
                            </select>
                        </div>
                        <div class="form-group mb-md-0">
                            <input type="date" class="form-control" id="abo-date-debut"
                                   required title="Date de début de l'abonnement" />
                        </div>
                    </div>
                </div>


                <div class="row mb-4">
                    <div class="col-md-6 mx-auto">
                        <div id="abo-price-preview"></div>
                    </div>
                </div>

                <div class="text-center">
                    <button class="btn btn-primary btn-xl text-uppercase" type="submit">
                        S'abonner
                        <span class="fas fa-cart-plus" aria-hidden="true"
                              style="margin-left: 10px;"></span>
                    </button>
                </div>
            </form>

        </div>
    </section>


    <footer class="footer py-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-4 text-lg-start">Copyright &copy; Club Sportif 2023</div>
                <div class="col-lg-4 my-3 my-lg-0">
                    <a class="btn btn-dark btn-social mx-2" href="#!" aria-label="Twitter">
                        <i class="fab fa-twitter"></i>
                    </a>
                    <a class="btn btn-dark btn-social mx-2" href="#!" aria-label="Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a class="btn btn-dark btn-social mx-2" href="#!" aria-label="LinkedIn">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                </div>
                <div class="col-lg-4 text-lg-end">
                    <a class="link-dark text-decoration-none me-3" href="#!">Politique de confidentialité</a>
                    <a class="link-dark text-decoration-none" href="#!">Conditions d'utilisation</a>
                </div>
            </div>
        </div>
    </footer>




    <script src="../js/include-navbar.js"></script>


    <script>
        document.addEventListener('DOMContentLoaded', function () {
            loadAllAbonnements();
        });

        function loadAllAbonnements() {
            loadCategoryAbonnements('gym', 'gym-abonnements');
            loadCategoryAbonnements('coaching', 'coaching-abonnements');
            loadCategoryAbonnements('acces', 'acces-abonnements');
        }

        function loadCategoryAbonnements(category, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const abonnements = abonnementsManager.getAbonnementsByCategory(category);
            container.innerHTML = '';

            abonnements.forEach(abonnement => {
                const block = document.createElement('div');
                block.className = 'block';

                let content = `<p>${abonnement.nom}
                    <span class="price">${abonnement.prix}DT/
                        <sub>${abonnement.duree}</sub>
                    </span>`;

                if (abonnement.description) {
                    content += `<ul class="options"><li>${abonnement.description}</li></ul>`;
                }

                if (abonnement.pack10) {
                    content += `<ul class="options">
                        <li>${abonnement.pack10}DT / Pack 10 Séances</li>
                    </ul>`;
                }

                content += '</p>';
                block.innerHTML = content;
                container.appendChild(block);
            });
        }
    </script>


    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/scripts.js"></script>
    <script src="../js/startbootstrap.js"></script>


    <script>
    (function () {

        const ABO_API_URL = "http://localhost/Club_Sportif/shared-backend/api/abonnements.php";

        const CATEGORIES = {
            gym:      "Gym",
            coaching: "Coaching Privé",
            acces:    "Accès Libre",
        };


        function formatDateAbo(d) {
            const obj = new Date(d);
            return obj.toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" });
        }

        function calcDateFin(debut, duree) {
            const d = new Date(debut);
            const map = { "1 mois": 1, "3 mois": 3, "6 mois": 6, "1 an": 12 };
            d.setMonth(d.getMonth() + (map[duree] || 1));
            return d.toISOString().split("T")[0];
        }

        function initLiveValidation() {
            const rules = {
                "abo-name":  v => v.trim().length >= 2,
                "abo-email": v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),
                "abo-phone": v => /^[0-9+\s\-]{8,15}$/.test(v),
            };

            Object.entries(rules).forEach(([id, test]) => {
                const input = document.getElementById(id);
                if (!input) return;

                const indicator = document.createElement("span");
                indicator.className = "abo-field-indicator";
                input.parentElement.style.position = "relative";
                input.parentElement.appendChild(indicator);

                input.addEventListener("input", () => {
                    const ok = test(input.value);
                    indicator.textContent = ok ? "✓" : "✗";
                    indicator.className   = "abo-field-indicator " + (ok ? "abo-fi-ok" : "abo-fi-err");
                    input.classList.toggle("abo-input-ok",  ok);
                    input.classList.toggle("abo-input-err", !ok && input.value.length > 0);
                });
            });
        }

        function updatePricePreview() {
            const cat    = document.getElementById("abo-category")?.value;
            const duree  = document.getElementById("abo-duree")?.value;
            const debut  = document.getElementById("abo-date-debut")?.value;
            const preview = document.getElementById("abo-price-preview");
            if (!preview) return;

            if (!cat || !duree) { preview.style.display = "none"; return; }

            let prix = null;
            if (typeof abonnementsManager !== "undefined") {
                const abos  = abonnementsManager.getAbonnementsByCategory(cat);
                const match = abos.find(a => a.duree === duree);
                if (match) prix = match.prix;
            }

            let html = `
                <div class="abo-preview-row">
                    <span>📋 Catégorie</span>
                    <span>${CATEGORIES[cat] || cat}</span>
                </div>
                <div class="abo-preview-row">
                    <span>⏳ Durée</span>
                    <span>${duree}</span>
                </div>`;

            if (debut) {
                html += `
                <div class="abo-preview-row">
                    <span>📅 Début</span>
                    <span>${formatDateAbo(debut)}</span>
                </div>
                <div class="abo-preview-row">
                    <span>📅 Fin estimée</span>
                    <span>${formatDateAbo(calcDateFin(debut, duree))}</span>
                </div>`;
            }

            if (prix !== null) {
                html += `
                <div class="abo-preview-row abo-preview-prix">
                    <span>💰 Prix</span>
                    <span>${prix} DT</span>
                </div>`;
            }

            preview.innerHTML = html;
            preview.style.display = "block";
        }

        function setLoading(on) {
            const btn = document.querySelector("#aboForm button[type='submit']");
            if (!btn) return;
            btn.disabled = on;
            if (on) {
                btn.dataset.original = btn.innerHTML;
                btn.innerHTML = `<span class="abo-spinner"></span> Traitement en cours...`;
            } else {
                btn.innerHTML = btn.dataset.original || "S'abonner";
            }
        }

        function showConfirmation(data) {
            const numRef   = "ABO-" + String(data.id || Math.floor(Math.random() * 99999)).padStart(6, "0");
            const catLabel = CATEGORIES[data.categorie] || data.categorie;
            const fin      = calcDateFin(data.date_debut, data.duree);

            document.getElementById("abo-confirm-card")?.remove();

            const card = document.createElement("div");
            card.id    = "abo-confirm-card";
            card.innerHTML = `
                <div class="abo-confirm-inner">
                    <div class="abo-confirm-icon">
                        <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="26" cy="26" r="25" stroke="#22c55e" stroke-width="2"/>
                            <path class="abo-check-path" d="M14 27l8 8 16-16"
                                  stroke="#22c55e" stroke-width="2.5"
                                  stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h3 class="abo-confirm-title">Abonnement confirmé !</h3>
                    <div class="abo-confirm-ref">
                        <span class="abo-ref-label">N° d'abonnement</span>
                        <span class="abo-ref-number">${numRef}</span>
                        <span class="abo-ref-hint">Présentez ce numéro à l'accueil</span>
                    </div>
                    <div class="abo-confirm-details">
                        <div class="abo-confirm-row">
                            <span class="abo-confirm-label">📋 Catégorie</span>
                            <span class="abo-confirm-value">${catLabel}</span>
                        </div>
                        <div class="abo-confirm-row">
                            <span class="abo-confirm-label">⏳ Durée</span>
                            <span class="abo-confirm-value">${data.duree}</span>
                        </div>
                        <div class="abo-confirm-row">
                            <span class="abo-confirm-label">📅 Début</span>
                            <span class="abo-confirm-value">${formatDateAbo(data.date_debut)}</span>
                        </div>
                        <div class="abo-confirm-row">
                            <span class="abo-confirm-label">📅 Fin estimée</span>
                            <span class="abo-confirm-value">${formatDateAbo(fin)}</span>
                        </div>
                        <div class="abo-confirm-row">
                            <span class="abo-confirm-label">👤 Nom</span>
                            <span class="abo-confirm-value">${data.nom}</span>
                        </div>
                    </div>
                    <button class="abo-confirm-close"
                            onclick="document.getElementById('abo-confirm-card').remove()">
                        Fermer
                    </button>
                </div>`;

            document.querySelector("#aboForm .text-center")?.appendChild(card);
            setTimeout(() => card.scrollIntoView({ behavior: "smooth", block: "center" }), 100);
        }

        function showError(msg) {
            let err = document.getElementById("abo-error-msg");
            if (!err) {
                err    = document.createElement("div");
                err.id = "abo-error-msg";
                document.querySelector("#aboForm .text-center")?.appendChild(err);
            }
            err.className      = "abo-error-msg-box";
            err.innerHTML      = `⚠️ ${msg}`;
            err.style.display  = "block";
            setTimeout(() => { if (err) err.style.display = "none"; }, 5000);
        }

        function initForm() {
            const form      = document.getElementById("aboForm");
            const dateInput = document.getElementById("abo-date-debut");
            if (!form) return;

            if (dateInput) dateInput.min = new Date().toISOString().split("T")[0];

            ["abo-category", "abo-duree", "abo-date-debut"].forEach(id => {
                document.getElementById(id)?.addEventListener("change", updatePricePreview);
            });

            form.addEventListener("submit", async function (e) {
                e.preventDefault();
                this.classList.add("was-validated");
                document.getElementById("abo-error-msg")?.remove();

                if (!this.checkValidity()) {
                    showError("Veuillez remplir tous les champs correctement.");
                    return;
                }

                const nom       = document.getElementById("abo-name").value.trim();
                const email     = document.getElementById("abo-email").value.trim();
                const telephone = document.getElementById("abo-phone").value.trim();
                const categorie = document.getElementById("abo-category").value;
                const duree     = document.getElementById("abo-duree").value;
                const dateDebut = document.getElementById("abo-date-debut").value;

                setLoading(true);

                try {
                    const res  = await fetch(ABO_API_URL, {
                        method:  "POST",
                        headers: { "Content-Type": "application/json" },
                        body:    JSON.stringify({ nom, email, telephone, categorie, duree, date_debut: dateDebut }),
                    });
                    const json = await res.json();

                    if (json.success) {
                        showConfirmation({ id: json.id, nom, categorie, duree, date_debut: dateDebut });
                        resetForm(this);
                    } else {
                        showError(json.error || "Une erreur est survenue.");
                    }
                } catch {
                    showConfirmation({
                        id: Math.floor(Math.random() * 99999),
                        nom, categorie, duree,
                        date_debut: dateDebut
                    });
                    resetForm(this);
                } finally {
                    setLoading(false);
                }
            });
        }

        function resetForm(form) {
            form.reset();
            form.classList.remove("was-validated");
            document.querySelectorAll(".abo-field-indicator").forEach(el => {
                el.textContent = ""; el.className = "abo-field-indicator";
            });
            document.querySelectorAll(".abo-input-ok, .abo-input-err").forEach(el => {
                el.classList.remove("abo-input-ok", "abo-input-err");
            });
            const preview = document.getElementById("abo-price-preview");
            if (preview) preview.style.display = "none";
        }

        function injectStyles() {
            const s = document.createElement("style");
            s.textContent = `

                /* Validation temps réel */
                .abo-field-indicator {
                    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
                    font-size: 1rem; font-weight: 700; pointer-events: none; transition: all 0.2s;
                }
                .abo-fi-ok  { color: #22c55e; }
                .abo-fi-err { color: #ef4444; }
                .abo-input-ok  { border-color: #22c55e !important; box-shadow: 0 0 0 2px rgba(34,197,94,.15) !important; }
                .abo-input-err { border-color: #ef4444 !important; box-shadow: 0 0 0 2px rgba(239,68,68,.15) !important; }

                /* Récapitulatif */
                #abo-price-preview {
                    display: none;
                    background: #fff;
                    border: 1.5px solid #d1d5db;
                    border-radius: 12px;
                    padding: 1rem 1.2rem;
                    margin-top: .5rem;
                }
                .abo-preview-row {
                    display: flex; justify-content: space-between;
                    padding: .4rem 0; border-bottom: 1px solid #f3f4f6;
                    font-size: .9rem;
                }
                .abo-preview-row:last-child { border-bottom: none; }
                .abo-preview-prix {
                    font-weight: 700; font-size: 1rem; color: #15803d;
                    border-top: 2px solid #dcfce7; margin-top: .4rem; padding-top: .6rem;
                }

                /* Spinner */
                .abo-spinner {
                    display: inline-block; width: 13px; height: 13px;
                    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
                    border-radius: 50%; animation: abo-spin .65s linear infinite;
                    vertical-align: middle; margin-right: 6px;
                }

                /* Carte confirmation */
                #abo-confirm-card {
                    margin-top: 2rem;
                    animation: abo-popIn .4s cubic-bezier(.34,1.56,.64,1);
                }
                .abo-confirm-inner {
                    background: #fff; border: 2px solid #22c55e;
                    border-radius: 16px; padding: 2rem 2.5rem;
                    max-width: 440px; margin: 0 auto; text-align: center;
                    box-shadow: 0 8px 32px rgba(34,197,94,.15);
                }
                .abo-confirm-icon svg { width: 56px; height: 56px; margin-bottom: 1rem; }
                .abo-check-path {
                    stroke-dasharray: 40; stroke-dashoffset: 40;
                    animation: abo-drawCheck .5s ease .3s forwards;
                }
                .abo-confirm-title {
                    font-size: 1.3rem; font-weight: 700; color: #15803d; margin-bottom: 1.2rem;
                }
                .abo-confirm-ref {
                    display: flex; flex-direction: column; align-items: center;
                    background: #f0fdf4; border: 2px dashed #86efac;
                    border-radius: 12px; padding: 1rem 1.5rem; margin-bottom: 1.2rem;
                }
                .abo-ref-label {
                    font-size: .75rem; text-transform: uppercase;
                    letter-spacing: .08em; color: #6b7280; margin-bottom: .3rem;
                }
                .abo-ref-number {
                    font-size: 1.6rem; font-weight: 800;
                    letter-spacing: .12em; color: #15803d; font-family: monospace;
                }
                .abo-ref-hint { font-size: .75rem; color: #9ca3af; margin-top: .3rem; }
                .abo-confirm-details {
                    background: #f0fdf4; border-radius: 10px;
                    padding: 1rem 1.2rem; margin-bottom: 1.4rem;
                }
                .abo-confirm-row {
                    display: flex; justify-content: space-between; align-items: center;
                    padding: .45rem 0; border-bottom: 1px solid #dcfce7; font-size: .93rem;
                }
                .abo-confirm-row:last-child { border-bottom: none; }
                .abo-confirm-label { color: #6b7280; }
                .abo-confirm-value { font-weight: 600; color: #111; }
                .abo-confirm-close {
                    background: #22c55e; color: #fff; border: none;
                    border-radius: 8px; padding: .55rem 1.8rem;
                    font-size: .9rem; font-weight: 600; cursor: pointer; transition: background .2s;
                }
                .abo-confirm-close:hover { background: #16a34a; }

                /* Erreur */
                .abo-error-msg-box {
                    margin-top: 1rem; padding: .9rem 1.2rem;
                    background: #fef2f2; border: 1.5px solid #fca5a5;
                    color: #991b1b; border-radius: 10px; font-size: .9rem;
                    animation: abo-fadeIn .3s ease;
                }

                /* Animations */
                @keyframes abo-popIn {
                    from { opacity: 0; transform: scale(.92) translateY(12px); }
                    to   { opacity: 1; transform: scale(1)   translateY(0); }
                }
                @keyframes abo-fadeIn {
                    from { opacity: 0; transform: translateY(6px); }
                    to   { opacity: 1; transform: translateY(0); }
                }
                @keyframes abo-drawCheck { to { stroke-dashoffset: 0; } }
                @keyframes abo-spin { to { transform: rotate(360deg); } }
            `;
            document.head.appendChild(s);
        }

        document.addEventListener("DOMContentLoaded", () => {
            injectStyles();
            initLiveValidation();
            initForm();
        });

    })();
    </script>

</body>
</html>
