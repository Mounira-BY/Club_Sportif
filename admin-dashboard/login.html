<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="au theme template">
    <meta name="author" content="Hau Nguyen">
    <meta name="keywords" content="au theme template">

    <!-- Title Page-->
    <title>Login</title>
    <link href="../acceuil/css/monserrat.css" rel="stylesheet" type="text/css" />
    <link href="../acceuil/css/styles.css" rel="stylesheet" />

    <!-- Fontfaces CSS-->

    <!-- Bootstrap CSS-->

    <!-- Vendor CSS-->

    <!-- Main CSS-->
    
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" defer></script>
<link href="css/admin-shell.css" rel="stylesheet" />
<script src="js/embed.js"></script>
</head>

<body>
    <div class="page-wrapper">
        <div class="page-content--bge5">
            <div class="container">
                <div class="login-wrap">
                    <div class="login-content">
                        <div class="login-logo">
                            <a href="#">
                                <img src="images/icon/logo-fitness-center.png" alt="CoolAdmin">
                            </a>
                        </div>
                        <div class="login-form">
                            <form id="loginForm">
                                <div class="form-group">
                                    <input type="text" id="username" class="au-input au-input--full"
                                        placeholder="Username" required />
                                </div>

                                <div class="form-group">
                                    <input type="password" id="password" class="au-input au-input--full"
                                        placeholder="Password" required />
                                </div>

                                <button class="au-btn au-btn--block au-btn--green m-b-20" type="submit">
                                    Sign in
                                </button>

                                <p id="loginError" class="text-danger text-center mt-2" style="display:none;">
                                    ❌ Username or password incorrect
                                </p>
                            </form>

                            <div class="register-link">
                                <p>
                                    Don't you have account?
                                    <a href="#">Sign Up Here</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Jquery JS-->
    <script src="js/vanilla-utils.js"></script>
    <!-- Bootstrap JS-->
    <script src="vendor/bootstrap-5.3.8.bundle.min.js"></script>
    <!-- Vendor JS       -->
    <script src="vendor/perfect-scrollbar/perfect-scrollbar-1.5.6.min.js"></script>
    <script src="vendor/chartjs/chart.umd.js-4.5.1.min.js"></script>

    <!-- Main JS-->
    <script src="js/bootstrap5-init.js"></script>
    <script src="js/main-vanilla.js"></script>
    <script src="js/swiper-bundle-12.0.3.min.js"></script>
    <script src="js/aos.js"></script>
    <script src="js/modern-plugins.js"></script>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault(); // stop page reload

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const error = document.getElementById("loginError");

            if (username === "admin" && password === "admin") {
                // success → redirect
                window.location.replace("index1.html");
            } else {
                // show error
                error.style.display = "block";
            }
        });
    </script>

</body>

</html>
<!-- end document-->
