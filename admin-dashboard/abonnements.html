<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Smart GYM - Gestion des Abonnements</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="../acceuil/css/fontawesome/css/admin-shell.css" rel="stylesheet" />

  <!-- ✅ Our JS file — no abonnements-manager.js anymore -->
  <script src="js/abonnements-manager.js" defer></script>

  <style>
    body { background: #f4f6f9; font-family: 'Roboto Slab', sans-serif; }

    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }

    .admin-header {
      background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
      color: white; padding: 30px; border-radius: 15px;
      margin-bottom: 30px; text-align: center;
    }
    .admin-header h1 { margin: 0; font-size: 2.2rem; font-weight: 700; }
    .admin-header p  { margin: 8px 0 0; opacity: 0.85; }

    .category-section {
      background: white; border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 28px; overflow: hidden;
    }
    .category-header {
      background: #f8f9fa; padding: 18px 22px;
      border-bottom: 2px solid #e9ecef;
      display: flex; justify-content: space-between; align-items: center;
    }
    .category-title { margin: 0; color: #2c3e50; font-size: 1.3rem; font-weight: 600; }

    .btn-add {
      background: #ffc800; color: white; border: none;
      padding: 9px 18px; border-radius: 6px; font-weight: 600;
      cursor: pointer; transition: all 0.25s;
    }
    .btn-add:hover { background: #e6b800; transform: translateY(-2px); }

    .abonnements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px; padding: 20px;
    }

    .abonnement-card {
      background: white; border: 2px solid #e9ecef;
      border-radius: 10px; padding: 20px; transition: all 0.25s;
    }
    .abonnement-card:hover { border-color: #ffc800; box-shadow: 0 6px 18px rgba(255,200,0,.2); }
    .abonnement-name        { font-size: 1.15rem; font-weight: 600; color: #2c3e50; margin-bottom: 8px; }
    .abonnement-price       { font-size: 1.8rem; font-weight: 700; color: #ffc800; margin-bottom: 4px; }
    .abonnement-duration    { color: #6c757d; font-size: 0.88rem; margin-bottom: 8px; }
    .abonnement-description { color: #495057; font-size: 0.88rem; margin-bottom: 12px; }
    .abonnement-actions     { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

    .btn-edit, .btn-delete {
      padding: 7px 14px; border: none; border-radius: 5px;
      font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .btn-edit   { background: #4e73df; color: white; }
    .btn-edit:hover   { background: #2e59d9; }
    .btn-delete { background: #e74a3b; color: white; }
    .btn-delete:hover { background: #c82333; }

    .empty-state { text-align: center; padding: 40px; color: #adb5bd; }
    .empty-state i { font-size: 2.5rem; display: block; margin-bottom: 12px; }

    /* ── Modals ─────────────────────────────── */
    .sg-modal {
      display: none; position: fixed; inset: 0; z-index: 1050;
      background: rgba(0,0,0,0.55);
      align-items: center; justify-content: center;
    }
    .sg-modal.active { display: flex; }

    .sg-modal-box {
      background: white; border-radius: 12px; padding: 28px;
      width: 90%; max-width: 480px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }
    .sg-modal-head {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 22px;
    }
    .sg-modal-head h2 { margin: 0; color: #2c3e50; font-size: 1.3rem; font-weight: 600; }
    .btn-x { background: none; border: none; font-size: 1.6rem; cursor: pointer; color: #aaa; line-height: 1; }
    .btn-x:hover { color: #333; }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; margin-bottom: 5px;
      color: #2c3e50; font-weight: 600; font-size: 0.88rem;
    }
    .form-group input,
    .form-group textarea {
      width: 100%; padding: 9px 12px; border: 2px solid #e9ecef;
      border-radius: 6px; font-size: 0.95rem; font-family: inherit;
      box-sizing: border-box; transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus { outline: none; border-color: #ffc800; }

    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
    .btn-secondary {
      background: #6c757d; color: white; border: none;
      padding: 9px 20px; border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    .btn-secondary:hover { background: #545b62; }
    .btn-primary {
      background: #ffc800; color: white; border: none;
      padding: 9px 20px; border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    .btn-primary:hover { background: #e6b800; }
    .btn-danger {
      background: #e74a3b; color: white; border: none;
      padding: 9px 20px; border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    .btn-danger:hover { background: #c82333; }

    @media (max-width: 768px) {
      .abonnements-grid { grid-template-columns: 1fr; }
      .category-header  { flex-direction: column; gap: 12px; text-align: center; }
    }
  </style>
</head>

<body>
<div class="page-wrap">

  <div class="admin-header">
    <h1><i class="fas fa-cogs me-2"></i>Gestion des Abonnements</h1>
    <p>Administrez le catalogue des abonnements du Club Sportif</p>
  </div>

  <!-- JS builds sections here -->
  <div id="sectionsContainer"></div>

</div>

<!-- ── Add / Edit Modal ── -->
<div id="abonnementModal" class="sg-modal">
  <div class="sg-modal-box">
    <div class="sg-modal-head">
      <h2 id="modalTitle">Ajouter un abonnement</h2>
      <button class="btn-x" onclick="closeModal()">×</button>
    </div>

    <input type="hidden" id="f_id">
    <input type="hidden" id="f_categorie">

    <div class="form-group">
      <label>Nom de l'abonnement *</label>
      <input type="text" id="f_nom" placeholder="ex: Gym Mensuel" required>
    </div>
    <div class="form-group">
      <label>Prix (DT) *</label>
      <input type="number" id="f_prix" min="0" step="0.01" required>
    </div>
    <div class="form-group">
      <label>Durée *</label>
      <input type="text" id="f_duree" placeholder="ex: Mois, Séance, Pack" required>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="f_description" rows="3" placeholder="Description de l'abonnement"></textarea>
    </div>
    <div class="form-group" id="pack10Group" style="display:none">
      <label>Prix pack 10 séances (optionnel)</label>
      <input type="number" id="f_pack10" min="0" step="0.01" placeholder="ex: 250">
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn-primary"   id="btnSave" onclick="saveAbonnement()">
        <i class="fas fa-save me-1"></i> Enregistrer
      </button>
    </div>
  </div>
</div>

<!-- ── Delete Confirm Modal ── -->
<div id="deleteModal" class="sg-modal">
  <div class="sg-modal-box" style="max-width:400px">
    <div class="sg-modal-head">
      <h2>Confirmer la suppression</h2>
      <button class="btn-x" onclick="closeDeleteModal()">×</button>
    </div>
    <p style="color:#495057;line-height:1.6">
      Êtes-vous sûr de vouloir supprimer cet abonnement ?<br>
      <strong>Cette action est irréversible.</strong>
    </p>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeDeleteModal()">Annuler</button>
      <button class="btn-danger"    onclick="confirmDelete()">
        <i class="fas fa-trash me-1"></i> Supprimer
      </button>
    </div>
  </div>
</div>

<!-- Close on backdrop click -->
<script>
  document.querySelectorAll('.sg-modal').forEach(m =>
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('active'); })
  );
</script>
</body>
</html>
